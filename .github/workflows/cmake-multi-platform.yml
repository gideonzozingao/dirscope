# Builds and smoke-tests dirscope on Ubuntu with both GCC and Clang.
name: CMake on Ubuntu

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Report results for every combination, even if one fails.
      fail-fast: false

      # Runs 4 jobs: {gcc, clang} x {Release, Debug}
      matrix:
        compiler:
          - { cc: gcc,   cxx: g++ }
          - { cc: clang, cxx: clang++ }
        build_type: [Release, Debug]

    name: ${{ matrix.compiler.cc }} / ${{ matrix.build_type }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Show tool versions
      run: |
        ${{ matrix.compiler.cxx }} --version
        cmake --version
        ninja --version

    - name: Configure CMake
      run: >
        cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G Ninja
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build -j "$(nproc)"

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure

    - name: Demo run
      # Shows real output in the job log.
      run: ./build/dirscope /usr/include -n 5 --no-color
